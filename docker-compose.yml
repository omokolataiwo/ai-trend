services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitrends
      POSTGRES_USER: aitrends
      POSTGRES_PASSWORD: aitrends
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitrends -d aitrends"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local Ollama in Docker. On macOS, host Ollama at :11434 is often faster.
  ollama:
    image: ollama/ollama:latest
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aitrends:aitrends@db:5432/aitrends
      # host.docker.internal reaches Ollama on the Mac host
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:latest
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173
      SEED_ON_STARTUP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
